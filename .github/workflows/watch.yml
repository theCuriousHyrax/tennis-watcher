name: tennis-watch
on:
  schedule:
    - cron: "*/5 * * * *"   # every ~5 minutes (GitHub cron can lag a few min)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tennis_watch.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "tennis-bot" && git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update" && git push)
